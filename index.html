<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Aura Palace - Control QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  min-height: 100vh;
  background: #0e1119;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.cabecera {
  margin-bottom: 14px;
}

h1 {
  margin: 5px 0 2px;
  color: #d7b878;
  font-size: 31px;
  letter-spacing: 2px;
}

.subtitulo {
  margin: 0;
  font-size: 15px;
  letter-spacing: 1px;
  color: #ddd;
}

#sesion {
  margin: 12px 0;
  font-size: 14px;
  color: #aaa;
}

button {
  width: 100%;
  max-width: 440px;
  padding: 17px;
  margin: 10px auto;
  border: none;
  border-radius: 12px;
  background: #d7b878;
  color: #111;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#reader {
  width: 100%;
  max-width: 440px;
  min-height: 300px;
  margin: 14px auto;
  background: #050505;
  border: 2px solid #d7b878;
  border-radius: 16px;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block !important;
}

#resultado {
  width: 100%;
  max-width: 440px;
  min-height: 175px;
  margin: 14px auto 20px;
  padding: 22px 15px;
  border-radius: 16px;
  background: #293241;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: background .2s;
}

#estado {
  font-size: 27px;
  line-height: 1.15;
  font-weight: 800;
}

#detalle {
  margin-top: 12px;
  font-size: 19px;
  line-height: 1.4;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.pie {
  margin-top: 10px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="cabecera">
  <h1>AURA PALACE</h1>
  <div class="subtitulo">CONTROL DE ENTRADAS</div>
</div>

<button id="iniciar" onclick="iniciarControl()">
  INICIAR CONTROL
</button>

<div id="sesion">Acceso protegido con Google</div>

<div id="reader"></div>

<div id="resultado">
  <div id="estado">CONTROL DETENIDO</div>
  <div id="detalle">Tocá INICIAR CONTROL</div>
</div>

<div class="pie">
  Sistema de control de acceso · Aura Palace
</div>

<script>

const CLIENT_ID =
"649138944017-rretdreji3l8u53bh6mo2q49sto1n058.apps.googleusercontent.com";

const SPREADSHEET_ID =
"1FBUPZIg_rd_vpGvQ2m5EKg3jv-8Q6B7oSSmIlWdDE_o";

const SHEET_NAME = "ENTRADAS";

let accessToken = "";
let scanner = null;
let procesando = false;
let ultimoCodigo = "";
let ultimoMomento = 0;


/* =========================
   PANTALLA
========================= */

function mostrar(titulo, detalle, color) {

  document.getElementById("estado").textContent = titulo;
  document.getElementById("detalle").textContent = detalle || "";
  document.getElementById("resultado").style.background = color;
}


/* =========================
   SONIDOS
========================= */

function tono(freq, duracion) {

  try {

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    const audio =
      new AudioCtx();

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();

    osc.frequency.value = freq;
    gain.gain.value = 0.20;

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + duracion);

    osc.onended = () => audio.close();

  } catch(e) {}
}


function sonidoValido() {

  tono(880, .12);

  setTimeout(() => {
    tono(1250, .18);
  }, 140);
}


function sonidoUtilizada() {

  tono(500, .20);

  setTimeout(() => {
    tono(500, .20);
  }, 260);
}


function sonidoError() {

  tono(250, .40);
}


/* =========================
   GOOGLE
========================= */

function iniciarControl() {

  if (!window.google || !google.accounts) {

    mostrar(
      "ERROR",
      "No se pudo iniciar Google.\nActualizá la página.",
      "#b91c1c"
    );

    return;
  }


  const tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope:
        "https://www.googleapis.com/auth/spreadsheets",

      callback: async (respuesta) => {

        if (respuesta.error) {

          mostrar(
            "ERROR DE ACCESO",
            "No se pudo iniciar sesión con Google.",
            "#b91c1c"
          );

          return;
        }


        accessToken =
          respuesta.access_token;


        document.getElementById("sesion").textContent =
          "● Sistema conectado";


        document.getElementById("iniciar").style.display =
          "none";


        mostrar(
          "INICIANDO CÁMARA...",
          "Preparando lector QR",
          "#293241"
        );


        await iniciarCamara();
      }
    });


  tokenClient.requestAccessToken({
    prompt: ""
  });
}


/* =========================
   LEER PLANILLA
========================= */

async function leerEntradas() {

  const rango =
    encodeURIComponent(
      SHEET_NAME + "!A2:G"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rango;


  const respuesta =
    await fetch(url, {

      headers: {
        Authorization:
          "Bearer " + accessToken
      }
    });


  const texto =
    await respuesta.text();


  if (!respuesta.ok) {

    throw new Error(
      "No se pudo consultar la lista."
    );
  }


  const datos =
    JSON.parse(texto);


  return datos.values || [];
}


/* =========================
   REGISTRAR INGRESO
========================= */

async function registrarIngreso(fila) {

  const rango =
    encodeURIComponent(
      SHEET_NAME +
      "!F" +
      fila +
      ":G" +
      fila
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rango +
    "?valueInputOption=USER_ENTERED";


  const respuesta =
    await fetch(url, {

      method: "PUT",

      headers: {

        Authorization:
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({

        values: [[
          "INGRESO REGISTRADO",
          new Date().toISOString()
        ]]
      })
    });


  if (!respuesta.ok) {

    throw new Error(
      "No se pudo registrar el ingreso."
    );
  }
}


/* =========================
   VALIDAR QR
========================= */

async function validarEntrada(codigo) {

  codigo =
    String(codigo || "").trim();


  if (!codigo || procesando)
    return;


  const ahora =
    Date.now();


  if (
    codigo === ultimoCodigo &&
    ahora - ultimoMomento < 3000
  ) {
    return;
  }


  ultimoCodigo =
    codigo;

  ultimoMomento =
    ahora;

  procesando =
    true;


  mostrar(
    "VERIFICANDO...",
    "Comprobando entrada",
    "#334155"
  );


  try {

    const entradas =
      await leerEntradas();


    const indice =
      entradas.findIndex(

        fila =>
          String(fila[1] || "").trim() === codigo
      );


    /* NO EXISTE */

    if (indice === -1) {

      mostrar(
        "✕ INGRESO RECHAZADO",
        "ENTRADA NO VÁLIDA\nNO PERMITIR INGRESO",
        "#b91c1c"
      );


      sonidoError();


      if (navigator.vibrate)
        navigator.vibrate([400,150,400]);


      return;
    }


    const entrada =
      entradas[indice];


    const numero =
      String(entrada[0] || "");


    const comprador =
      String(entrada[2] || "").trim();


    const pago =
      String(entrada[4] || "")
        .trim()
        .toUpperCase();


    const ingreso =
      String(entrada[5] || "")
        .trim()
        .toUpperCase();


    /* YA UTILIZADA */

    if (
      ingreso ===
      "INGRESO REGISTRADO"
    ) {

      mostrar(
        "⚠ ENTRADA YA UTILIZADA",

        "Entrada N.º " +
        numero +

        (comprador
          ? "\n" + comprador
          : "") +

        "\n\nNO PERMITIR INGRESO",

        "#a66a08"
      );


      sonidoUtilizada();


      if (navigator.vibrate)
        navigator.vibrate([250,120,250]);


      return;
    }


    /* NO PAGADA */

    if (pago !== "PAGADO") {

      mostrar(
        "✕ ENTRADA NO HABILITADA",

        "Entrada N.º " +
        numero +

        (comprador
          ? "\n" + comprador
          : "") +

        "\n\nPAGO NO REGISTRADO",

        "#b91c1c"
      );


      sonidoError();


      if (navigator.vibrate)
        navigator.vibrate([400,150,400]);


      return;
    }


    /* REGISTRAR */

    const numeroFila =
      indice + 2;


    await registrarIngreso(
      numeroFila
    );


    /* AUTORIZADA */

    mostrar(
      "✓ INGRESO AUTORIZADO",

      "Entrada N.º " +
      numero +

      (comprador
        ? "\n" + comprador
        : "") +

      "\n\nINGRESO REGISTRADO",

      "#16803c"
    );


    sonidoValido();


    if (navigator.vibrate)
      navigator.vibrate(180);


  } catch(error) {

    mostrar(
      "✕ ERROR DE CONEXIÓN",
      "No se modificó la entrada.\nIntentá nuevamente.",
      "#b91c1c"
    );


    sonidoError();


    if (navigator.vibrate)
      navigator.vibrate([400,150,400]);


  } finally {

    procesando =
      false;
  }
}


/* =========================
   CÁMARA
========================= */

async function iniciarCamara() {

  scanner =
    new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 240,
          height: 240
        },

        aspectRatio: 1
      },

      (codigo) => {

        validarEntrada(
          codigo
        );
      },

      () => {}
    );


    mostrar(
      "LISTO PARA ESCANEAR",
      "Apuntá la cámara al código QR",
      "#293241"
    );


  } catch(error) {

    mostrar(
      "ERROR DE CÁMARA",
      "Revisá el permiso de cámara y actualizá la página.",
      "#b91c1c"
    );
  }
}

</script>

</body>
</html>
