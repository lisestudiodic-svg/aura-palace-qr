<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Aura Palace - Control QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #d7b878;
      margin: 5px 0;
      font-size: 32px;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: normal;
    }

    #reader {
      width: 100%;
      max-width: 430px;
      margin: 18px auto;
      border-radius: 14px;
      overflow: hidden;
    }

    #resultado {
      width: 100%;
      max-width: 430px;
      min-height: 165px;
      margin: 18px auto;
      padding: 22px 15px;
      border-radius: 15px;
      background: #293241;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #estado {
      font-size: 27px;
      line-height: 1.15;
      font-weight: bold;
    }

    #detalle {
      white-space: pre-wrap;
      margin-top: 12px;
      font-size: 16px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      width: 100%;
    }

    button {
      width: 100%;
      max-width: 430px;
      padding: 17px;
      margin: 6px auto;
      border: 0;
      border-radius: 10px;
      background: #d7b878;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #probar {
      display: none;
      background: white;
    }

    #sesion {
      font-size: 14px;
      opacity: .8;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<h1>AURA PALACE</h1>
<h2>CONTROL DE ENTRADAS QR</h2>

<button id="iniciar" onclick="iniciarControl()">
  INICIAR CONTROL
</button>

<button id="probar" onclick="probarConexion()">
  PROBAR CONEXIÓN
</button>

<div id="sesion">Acceso protegido con Google</div>

<div id="reader"></div>

<div id="resultado">
  <div id="estado">Control detenido</div>
  <div id="detalle">Tocá INICIAR CONTROL</div>
</div>

<script>

const CLIENT_ID =
"649138944017-rretdreji3l8u53bh6mo2q49sto1n058.apps.googleusercontent.com";

const SPREADSHEET_ID =
"1FBUPZIg_rd_vpGvQ2m5EKg3jv-8Q6B7oSSmIlWdDE_o";

const SHEET_NAME = "ENTRADAS";

let accessToken = "";
let scanner = null;
let procesando = false;
let ultimoCodigo = "";
let ultimoMomento = 0;


/* PANTALLA */

function mostrar(titulo, detalle, color) {
  document.getElementById("estado").textContent = titulo;
  document.getElementById("detalle").textContent = detalle || "";
  document.getElementById("resultado").style.background = color;
}


/* SONIDO */

function tono(freq, duracion) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audio = new AudioCtx();
    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.frequency.value = freq;
    gain.gain.value = 0.18;

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + duracion);

    osc.onended = () => audio.close();
  } catch(e) {}
}

function sonidoValido() {
  tono(880, .12);
  setTimeout(() => tono(1250, .18), 140);
}

function sonidoUtilizada() {
  tono(520, .20);
  setTimeout(() => tono(520, .20), 260);
}

function sonidoError() {
  tono(260, .40);
}


/* GOOGLE LOGIN */

function iniciarControl() {

  if (!window.google || !google.accounts) {
    mostrar(
      "ERROR",
      "Google todavía no terminó de cargar.",
      "#b91c1c"
    );
    return;
  }

  const tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope:
        "https://www.googleapis.com/auth/spreadsheets",

      callback: async (respuesta) => {

        if (respuesta.error) {
          mostrar(
            "ERROR DE ACCESO",
            JSON.stringify(respuesta),
            "#b91c1c"
          );
          return;
        }

        accessToken = respuesta.access_token;

        document.getElementById("sesion").textContent =
          "Google conectado ✓";

        document.getElementById("iniciar").style.display =
          "none";

        document.getElementById("probar").style.display =
          "block";

        /*
          IMPORTANTE:
          primero NO abrimos la cámara.
          Primero probamos Google Sheets.
        */

        mostrar(
          "GOOGLE CONECTADO",
          "Ahora tocá PROBAR CONEXIÓN",
          "#293241"
        );
      }
    });

  tokenClient.requestAccessToken({
    prompt: ""
  });
}


/* PRUEBA SEGURA DE GOOGLE SHEETS */

async function probarConexion() {

  mostrar(
    "PROBANDO...",
    "Consultando Google Sheets",
    "#334155"
  );

  try {

    const rango =
      encodeURIComponent(
        SHEET_NAME + "!A1:G3"
      );

    const url =
      "https://sheets.googleapis.com/v4/spreadsheets/" +
      SPREADSHEET_ID +
      "/values/" +
      rango;

    const respuesta =
      await fetch(url, {
        method: "GET",
        headers: {
          Authorization:
            "Bearer " + accessToken
        }
      });

    const texto =
      await respuesta.text();

    if (!respuesta.ok) {

      mostrar(
        "ERROR DE GOOGLE",
        "CÓDIGO HTTP: " +
        respuesta.status +
        "\n\nRESPUESTA:\n" +
        texto,
        "#b91c1c"
      );

      return;
    }

    mostrar(
      "✓ CONEXIÓN CORRECTA",
      "Google Sheets respondió correctamente.\n\nNo se modificó ninguna entrada.",
      "#16803c"
    );

    document.getElementById("probar").style.display =
      "none";

    await iniciarCamara();

  } catch(error) {

    mostrar(
      "ERROR TÉCNICO",
      String(error),
      "#b91c1c"
    );
  }
}


/* LEER ENTRADAS */

async function leerEntradas() {

  const rango =
    encodeURIComponent(
      SHEET_NAME + "!A2:G"
    );

  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rango;

  const respuesta =
    await fetch(url, {
      headers: {
        Authorization:
          "Bearer " + accessToken
      }
    });

  const texto =
    await respuesta.text();

  if (!respuesta.ok) {
    throw new Error(
      "HTTP " +
      respuesta.status +
      " - " +
      texto
    );
  }

  const datos =
    JSON.parse(texto);

  return datos.values || [];
}


/* REGISTRAR */

async function registrarIngreso(fila) {

  const rango =
    encodeURIComponent(
      SHEET_NAME +
      "!F" +
      fila +
      ":G" +
      fila
    );

  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rango +
    "?valueInputOption=USER_ENTERED";

  const respuesta =
    await fetch(url, {

      method: "PUT",

      headers: {
        Authorization:
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({
        values: [[
          "INGRESO REGISTRADO",
          new Date().toISOString()
        ]]
      })
    });

  const texto =
    await respuesta.text();

  if (!respuesta.ok) {
    throw new Error(
      "HTTP " +
      respuesta.status +
      " - " +
      texto
    );
  }
}


/* VALIDACIÓN */

async function validarEntrada(codigo) {

  codigo =
    String(codigo || "").trim();

  if (!codigo || procesando)
    return;

  const ahora = Date.now();

  if (
    codigo === ultimoCodigo &&
    ahora - ultimoMomento < 3000
  ) {
    return;
  }

  ultimoCodigo = codigo;
  ultimoMomento = ahora;
  procesando = true;

  mostrar(
    "VERIFICANDO...",
    "Consultando entrada",
    "#334155"
  );

  try {

    const entradas =
      await leerEntradas();

    const indice =
      entradas.findIndex(
        fila =>
          String(fila[1] || "").trim() === codigo
      );

    if (indice === -1) {

      mostrar(
        "✕ INGRESO RECHAZADO",
        "Entrada no encontrada",
        "#b91c1c"
      );

      sonidoError();

      if (navigator.vibrate)
        navigator.vibrate([400,150,400]);

      return;
    }


    const entrada =
      entradas[indice];

    const numero =
      String(entrada[0] || "");

    const comprador =
      String(entrada[2] || "").trim();

    const pago =
      String(entrada[4] || "")
      .trim()
      .toUpperCase();

    const ingreso =
      String(entrada[5] || "")
      .trim()
      .toUpperCase();


    if (
      ingreso ===
      "INGRESO REGISTRADO"
    ) {

      mostrar(
        "⚠ ENTRADA YA UTILIZADA",
        "Entrada N.º " +
        numero +
        (comprador ? "\n" + comprador : "") +
        "\nNO PERMITIR INGRESO",
        "#a66a08"
      );

      sonidoUtilizada();

      if (navigator.vibrate)
        navigator.vibrate([250,120,250]);

      return;
    }


    if (pago !== "PAGADO") {

      mostrar(
        "✕ ENTRADA NO HABILITADA",
        "Entrada N.º " +
        numero +
        (comprador ? "\n" + comprador : "") +
        "\nPago no registrado",
        "#b91c1c"
      );

      sonidoError();

      return;
    }


    const numeroFila =
      indice + 2;

    await registrarIngreso(
      numeroFila
    );


    mostrar(
      "✓ INGRESO AUTORIZADO",
      "Entrada N.º " +
      numero +
      (comprador ? "\n" + comprador : "") +
      "\nIngreso registrado",
      "#16803c"
    );

    sonidoValido();

    if (navigator.vibrate)
      navigator.vibrate(180);


  } catch(error) {

    mostrar(
      "✕ ERROR DE CONEXIÓN",
      "ERROR REAL:\n" +
      error.message,
      "#b91c1c"
    );

    sonidoError();

  } finally {

    procesando = false;
  }
}


/* CÁMARA */

async function iniciarCamara() {

  scanner =
    new Html5Qrcode("reader");

  try {

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 240,
          height: 240
        }
      },

      (codigo) => {
        validarEntrada(codigo);
      },

      () => {}
    );

    mostrar(
      "LISTO PARA ESCANEAR",
      "Apuntá la cámara al código QR",
      "#293241"
    );

  } catch(error) {

    mostrar(
      "ERROR DE CÁMARA",
      String(error),
      "#b91c1c"
    );
  }
}

</script>

</body>
</html>
